name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:workspace-types
      - run: pnpm run build:workspace:ci
      - run: pnpm run lint:workspace:ci
      - run: pnpm run test:workspace:ci
      - run: pnpm lint:deadcode
      - run: pnpm pack:check-integrity

  consumer-smoke-pack:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:workspace:ci
      - run: pnpm consumer-smoke:pack

  consumer-smoke-pack-windows:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:workspace:ci
      - run: pnpm consumer-smoke:pack

  consumer-smoke-pack-macos:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:workspace:ci
      - run: pnpm consumer-smoke:pack

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e:smoke:ci

  browser-scenario:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lunatest/e2e-tests exec playwright install --with-deps chromium
      - run: pnpm run test:browser:ci

  external-consumer-proof-pack:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lunatest/e2e-tests exec playwright install --with-deps chromium
      - run: pnpm quickstart:wagmi:validate -- --enforce-ci-budget
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: external-consumer-proof-pack
          path: artifacts/external-consumer-proof/pack.json
          if-no-files-found: error

  performance-regression:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [quality, consumer-smoke-pack, e2e-smoke]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.33.4
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run perf:regression:ci
